server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: alexa-beauty-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Application Business Configuration
app:
  timezone: America/Bogota
  reservation-minutes: ${RESERVATION_MINUTES:45}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:3000}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: uploads
    base-url: /uploads
    supabase:
      url: ${SUPABASE_URL:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket-public: ${SUPABASE_STORAGE_BUCKET:products}


  whatsapp-number: ${WHATSAPP_BUSINESS_NUMBER:}
  auth:
    cookie-secure: false
    cookie-same-site: Lax
    require-origin: false
