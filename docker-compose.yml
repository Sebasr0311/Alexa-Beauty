services:
  postgres:
    image: postgres:16-alpine
    container_name: alexa-beauty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alexa_beauty
      POSTGRES_USER: alexa_admin
      POSTGRES_PASSWORD: alexa_secret_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alexa_admin -d alexa_beauty"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
